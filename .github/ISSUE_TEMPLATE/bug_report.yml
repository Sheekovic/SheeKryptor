name: Bug report
description: Report a reproducible problem without including sensitive data
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Never attach real passwords, 2FA seeds, private files, or API tokens. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: ["Desktop", "Web", "Both"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic, non-sensitive sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser or Python version
    validations:
      required: true
